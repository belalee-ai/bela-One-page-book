<svg xmlns="http://www.w3.org/2000/svg" width="800" height="324" viewBox="0 0 800 324" role="img" aria-labelledby="title desc">
<title id="title">一页读书：选书、整理、开始读</title>
<desc id="desc">安装 Skill 并上传书籍；助手检查文件、分章整理并核对出处，交付网页和文字版；选择书籍和风格，开始或继续阅读，分别标记导览和原书读完。缺工具或文件读不到时，说明补工具、换文字版或先整理可读部分的办法。</desc>

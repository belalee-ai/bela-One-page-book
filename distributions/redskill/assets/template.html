<!doctype html><html lang="zh-CN" data-theme="morandi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一页读书</title>
<style>
:root{--sans:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}/*THEMES*/
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.85 var(--sans)}button,select{font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px 16px;min-height:44px;cursor:pointer}button:hover{border-color:var(--green)}button:active{transform:translateY(1px)}:focus-visible{outline:3px solid var(--green);outline-offset:4px}button,summary{transition:background .22s,transform .22s}header{max-width:1160px;margin:auto;padding:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}header strong{margin-right:auto}label{display:inline-flex;gap:8px;align-items:center;max-width:100%}select{max-width:100%;min-width:0}#book{max-width:320px}main{max-width:1120px;margin:auto;padding:48px 24px 100px}section{padding:38px 0;border-bottom:1px solid var(--line)}h1{font:600 clamp(36px,6vw,78px)/1.18 var(--display,var(--sans));letter-spacing:-.025em;overflow-wrap:anywhere;max-width:950px;margin:18px 0 28px}h2{font-size:clamp(25px,3.2vw,36px);line-height:1.35;margin:0 0 22px}h3{font-size:21px;line-height:1.6;margin:0 0 12px}p{max-width:75ch;margin:12px 0}small,.muted{color:var(--muted)}.welcome{color:var(--muted);margin:0}.intro{font-size:21px;max-width:52ch}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 12px}.primary{background:var(--green);color:var(--accent-ink,#fffdf7);border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{padding:28px;background:var(--white);min-width:0;overflow-wrap:anywhere}.card p{margin-bottom:20px}.refs{display:flex;gap:8px;flex-wrap:wrap}.refs button{font-size:13px;padding:5px 10px;min-height:36px}.sketch{padding:28px;border:1.5px solid var(--green);border-radius:45% 4% 42% 3% / 3% 35% 4% 40%;background:var(--white);min-width:0;overflow-wrap:anywhere}.sketch span{font-size:13px;color:var(--green)}.sketches{margin:36px 0}.sketches.sequence .grid{grid-template-columns:1fr;max-width:780px}.sketches.sequence .sketch+.sketch:before{content:'↓';display:block;color:var(--green);margin-top:-26px;background:var(--paper);width:24px;text-align:center;transform:translateY(-9px)}details{border-top:1px solid var(--line);padding:15px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;font-size:20px;font-weight:600;overflow-wrap:anywhere}details>div{padding:4px 0 16px}blockquote{font:24px/1.8 var(--font-quote);letter-spacing:normal;margin:0 0 20px;overflow-wrap:anywhere}figure{margin:0}.coverage{font-size:14px;max-width:85ch}.stats{font-size:14px;color:var(--muted);flex-basis:100%}dialog{max-width:min(640px,calc(100% - 32px));max-height:80vh;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);overflow:auto}dialog::backdrop{background:#0006}dialog p{white-space:pre-wrap;overflow-wrap:anywhere}footer{display:flex;gap:12px;flex-wrap:wrap;padding-top:32px;align-items:center}#notice{font-size:14px;flex-basis:100%}.appear{animation:enter .36s ease-out}@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:680px){header{padding:18px;gap:12px}main{padding:30px 18px 70px}.grid{grid-template-columns:1fr;gap:18px}.card,.sketch{padding:23px}#book{max-width:calc(100vw - 105px)}h1{font-size:clamp(34px,8vw,50px)}section{padding:28px 0}.intro{font-size:19px}blockquote{font-size:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{header,footer,.actions,.refs button{display:none}details>div{display:block}body{background:white;color:black}.grid{display:block}.card{break-inside:avoid}}
</style>
<header><strong>一页读书</strong><label>选书 <select id="book" aria-label="选择阅读的书"></select></label><label>风格 <select id="theme"><option value="matisse">马蒂斯</option><option value="morandi">莫兰迪</option><option value="vintage">旧书纸张</option><option value="swiss">瑞士极简</option><option value="night">夜读</option></select></label><div class="stats" id="stats"></div></header>
<main id="main"></main>
<dialog id="source"><h2 id="source-title"></h2><p id="source-text"></p><p class="muted">这里只展示定位与短上下文，完整内容请回到原书。</p><button id="close-source">关闭</button></dialog>
<script type="application/json" id="books-data">/*BOOKS*/</script><script>/*APP*/</script></html>

<!doctype html><meta charset="utf-8"><title>标注隔离检查</title><button id="run">运行隔离检查</button><pre id="result">尚未运行；只使用独立测试数据库。</pre><script>
run.onclick=async()=>{run.disabled=true;const results=[],DB='bela-pdf-annotations-test',out=document.querySelector('#result');const assert=(ok,name)=>{if(!ok)throw Error(name);results.push('通过：'+name);out.textContent=results.join('\n')};const clear=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('marks')){db.close();res();return}const t=db.transaction('marks','readwrite');t.objectStore('marks').clear();t.oncomplete=()=>{db.close();res()};t.onabort=()=>rej(t.error)};r.onerror=()=>rej(r.error);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('marks',{keyPath:'id'});s.createIndex('bookId','bookId')}});try{
 await clear();const source=await (await fetch('../assets/reader/annotations.js')).text();(0,eval)(source.replace("DB='bela-pdf-annotations-v1'","DB='"+DB+"'"));const api=window.readingAnnotations,hash='a'.repeat(64),base={id:'test-one',bookId:'pdf:'+hash,fingerprint:hash,page:2,text:'测试摘录',rects:[[10,20,70,40]],note:'',style:'underline',deleted:false,createdAt:1,updatedAt:1};
 let rejected=0;for(const row of [{...base,page:0},{...base,rects:[[0,0,NaN,1]]},{...base,note:'x'.repeat(6001)},{...base,fingerprint:'bad'},{...base,rects:[[0,0,0,1]]}])try{api.validate([row])}catch{rejected++}assert(rejected===5,'拒绝损坏页码、坐标、超长笔记和错误指纹');
 const one=await api.put(base);assert((await api.list(base.bookId)).length===1,'真实 IndexedDB 写入和读取');await api.put({...base,id:'test-two',bookId:'pdf:'+'b'.repeat(64),fingerprint:'b'.repeat(64)});assert((await api.list(base.bookId)).length===1,'不同书籍记录隔离');
 await api.update(one.id,{note:'自动笔记'});await api.update(one.id,{style:'highlight'});assert((await api.list(base.bookId))[0].note==='自动笔记','修改样式保留笔记');
 const deleted=await api.update(one.id,{deleted:true});await api.merge([one]);assert((await api.list(base.bookId)).length===0,'旧备份不会复活已删除标注');await api.merge([{...deleted,deleted:false,updatedAt:deleted.updatedAt+10}]);await api.merge([{...deleted,deleted:false,updatedAt:deleted.updatedAt+10}]);assert((await api.list(base.bookId)).length===1,'较新备份恢复且重复导入不增加条数');
 await api.merge([]);assert((await api.list(base.bookId)).length===1,'旧版无标注备份不清空现有标注');
 let conflict=false;try{await api.merge([{...one,bookId:'pdf:'+'c'.repeat(64)}])}catch{conflict=true}assert(conflict&&(await api.list(base.bookId)).length===1,'身份冲突导入不改变原数据');
 let fail=false;try{await api.merge([{...base,id:'test-failure'}],()=>{throw Error('模拟进度存储失败')})}catch{fail=true}assert(fail&&!(await api.all()).some(m=>m.id==='test-failure'),'进度写入失败时标注事务一起回滚');
 await clear();out.textContent+='\n全部通过；测试记录已清空。';
}catch(e){out.textContent+='\n失败：'+e.message}finally{run.disabled=false}};
</script>
